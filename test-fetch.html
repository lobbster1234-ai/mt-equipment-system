<!DOCTYPE html>
<html>
<head>
  <title>Fetch Test</title>
</head>
<body>
  <h1>Fetch Test</h1>
  <button onclick="testFetch()">測試 Fetch</button>
  <div id="result" style="margin-top:20px;padding:10px;background:#eee;"></div>
  
  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';
    
    async function testFetch() {
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = 'Testing...';
      
      try {
        const url = GAS_URL + '?action=test';
        resultDiv.innerHTML += '<br>URL: ' + url;
        
        const res = await fetch(url);
        resultDiv.innerHTML += '<br>Status: ' + res.status;
        
        const text = await res.text();
        resultDiv.innerHTML += '<br>Response: ' + text.substring(0, 200);
      } catch (err) {
        resultDiv.innerHTML += '<br>Error: ' + err.message;
      }
    }
    
    // 自動執行
    testFetch();
  </script>
</body>
</html>
