<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核延後申請 - MT 設備系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      background: white;
      padding: 28px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #667eea; margin-bottom: 12px; }
    .info { background: #f8f9fa; padding: 14px 18px; border-radius: 8px; margin: 14px 0; text-align: left; }
    .info p { margin: 6px 0; color: #333; }
    .info strong { color: #667eea; }
    .highlight { background: #fff3cd; padding: 5px 10px; border-radius: 4px; display: inline-block; }
    .btn-approve { background: #28a745; color: white; border: none; padding: 11px 26px; border-radius: 8px; font-size: 1.05em; cursor: pointer; margin: 8px 5px; }
    .btn-approve:hover { background: #218838; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 11px 26px; border-radius: 8px; font-size: 1.05em; cursor: pointer; margin: 8px 5px; }
    .btn-reject:hover { background: #c82333; }
    .loading { color: #667eea; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">⏰ 審核延後申請</h1>
    <div id="content">
      <div class="info">
        <p><strong>📦 設備編號：</strong><span id="device-no">載入中...</span></p>
        <p><strong>📝 設備名稱：</strong><span id="device-name">載入中...</span></p>
        <p><strong>👤 借用人：</strong><span id="borrower-name">載入中...</span></p>
        <p><strong>📅 目前預計歸還：</strong><span id="current-due">載入中...</span></p>
        <p><strong>📅 申請延後至：</strong><span class="highlight" id="new-due">載入中...</span></p>
      </div>
      <p id="prompt" style="color: #666; margin: 12px 0;">請確認上述資訊後，選擇是否同意延後：</p>
      <div id="buttons">
        <button class="btn-approve" onclick="processPostpone('approve')">✅ 同意延後</button>
        <button class="btn-reject" onclick="processPostpone('reject')">❌ 不同意</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';
    
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('request_id');
    
    if (!requestId) {
      document.getElementById('title').textContent = '❌ 錯誤';
      document.getElementById('content').innerHTML = '<p class="error">❌ 無效的審核連結</p>';
    } else {
      loadRequestInfo();
    }
    
    async function loadRequestInfo() {
      try {
        const url = GAS_URL + '?action=getPostponeRequest&request_id=' + encodeURIComponent(requestId);
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        document.getElementById('device-no').textContent = data.fix_no || 'N/A';
        document.getElementById('device-name').textContent = data.device_name || 'N/A';
        document.getElementById('borrower-name').textContent = data.borrower || 'N/A';
        document.getElementById('current-due').textContent = formatDateTime(data.current_due) || '未設定';
        document.getElementById('new-due').textContent = formatDateTime(data.new_due) || '未設定';
      } catch (err) {
        // 根據錯誤訊息判斷是「連結無效」還是「載入失敗」
        const errorMsg = err.message || '';
        if (errorMsg.includes('已失效') || errorMsg.includes('找不到')) {
          document.getElementById('title').textContent = '❌ 連結無效';
          document.getElementById('content').innerHTML = `
            <div style="text-align:center;padding:30px;">
              <p style="font-size:3em;margin-bottom:20px;">🔗</p>
              <p style="color:#dc3545;font-size:1.2em;">此審核連結已失效</p>
              <p style="color:#666;margin-top:10px;">可能原因：</p>
              <ul style="color:#888;text-align:left;display:inline-block;margin-top:10px;">
                <li> Keeper 已經審核過了</li>
                <li> 此連結已過期</li>
              </ul>
              <p style="margin-top:30px;"><a href="index.html" style="color:#667eea;">→ 返回設備系統</a></p>
            </div>
          `;
        } else {
          document.getElementById('title').textContent = '❌ 錯誤';
          document.getElementById('content').innerHTML = '<p class="error">載入失敗：' + err.message + '</p>';
        }
      }
    }
    
    function formatDateTime(value) {
      if (!value) return '';
      
      // 如果是 Date 物件或是可以 parse 的字串
      let date;
      if (typeof value === 'object' && value instanceof Date) {
        date = value;
      } else if (typeof value === 'string') {
        // ISO 格式 (有 T) 或 已格式化 (沒 T)
        if (value.includes('T')) {
          date = new Date(value);
        } else {
          // 已經是 yyyy-MM-dd HH:mm 格式，直接回傳
          return value;
        }
      } else {
        date = new Date(value);
      }
      
      if (isNaN(date.getTime())) return value || '未設定';
      
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      const h = String(date.getHours()).padStart(2, '0');
      const min = String(date.getMinutes()).padStart(2, '0');
      
      return `${y}-${m}-${d} ${h}:${min}`;
    }
    
    async function processPostpone(action) {
      const btnApprove = document.querySelector('.btn-approve');
      const btnReject = document.querySelector('.btn-reject');
      const prompt = document.getElementById('prompt');
      
      btnApprove.disabled = true;
      btnReject.disabled = true;
      btnApprove.textContent = '處理中...';
      btnReject.textContent = '處理中...';
      prompt.textContent = '請稍候...';
      
      try {
        const url = GAS_URL + '?action=' + (action === 'approve' ? 'approvePostpone' : 'rejectPostpone') + '&request_id=' + encodeURIComponent(requestId);
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.success) {
          let newDueDisplay = '';
          if (action === 'approve' && data.new_due) {
            // 格式化新時間顯示
            const dt = new Date(data.new_due);
            const y = dt.getFullYear();
            const m = String(dt.getMonth() + 1).padStart(2, '0');
            const d = String(dt.getDate()).padStart(2, '0');
            const h = String(dt.getHours()).padStart(2, '0');
            const min = String(dt.getMinutes()).padStart(2, '0');
            newDueDisplay = `${y}-${m}-${d} ${h}:${min}`;
          }
          
          document.getElementById('title').textContent = action === 'approve' ? '✅ 已核准延後' : '❌ 已拒絕延後';
          
          if (action === 'approve') {
            document.getElementById('content').innerHTML = `
              <p class="success" style="font-size:1.2em;padding:20px;">
                ✅ 延後申請已核准！
              </p>
              <div style="background:#d4edda;padding:15px;border-radius:8px;margin:20px 0;text-align:left;">
                <strong>📅 新預計歸還時間：</strong><br>
                <span style="font-size:1.5em;color:#155724;font-weight:bold;">${newDueDisplay}</span>
              </div>
              <p style="color:#666;">系統已通知借用人。</p>
              <p style="color:#888;font-size:0.9em;margin-top:20px;">3 秒後自動跳轉...</p>
            `;
          } else {
            document.getElementById('content').innerHTML = `
              <p style="font-size:1.2em;padding:20px;color:#721c24;">
                ❌ 延後申請已拒絕
              </p>
              <div style="background:#f8d7da;padding:15px;border-radius:8px;margin:20px 0;text-align:left;">
                維持原本的歸還時間<br>
                系統已通知借用人。
              </div>
              <p style="color:#888;font-size:0.9em;margin-top:20px;">3 秒後自動跳轉...</p>
            `;
          }
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 3000);
        } else {
          throw new Error(data.error || '處理失敗');
        }
      } catch (err) {
        alert('處理失敗：' + err.message);
        btnApprove.disabled = false;
        btnReject.disabled = false;
        btnApprove.textContent = '✅ 同意延後';
        btnReject.textContent = '❌ 不同意';
        prompt.textContent = '請確認後選擇：';
      }
    }
  </script>
</body>
</html>
