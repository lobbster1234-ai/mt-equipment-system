<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核借用申請 - MT 設備系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 20px;
    }
    
    .info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
    }
    
    .info p {
      margin: 10px 0;
      color: #333;
    }
    
    .info strong {
      color: #667eea;
    }
    
    .btn-approve {
      background: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      margin: 10px 5px;
      transition: background 0.3s;
    }
    
    .btn-approve:hover {
      background: #218838;
    }
    
    .btn-reject {
      background: #dc3545;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      margin: 10px 5px;
      transition: background 0.3s;
    }
    
    .btn-reject:hover {
      background: #c82333;
    }
    
    .success {
      color: #28a745;
    }
    
    .error {
      color: #dc3545;
    }
    
    .loading {
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔒 審核借用申請</h1>
    <div id="content" class="loading">
      正在載入借用資訊，請稍候...
    </div>
  </div>

  <script>
    // GAS 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';

    // 從 URL 參數獲取 action 和 request_id
    const urlParams = new URLSearchParams(window.location.search);
    const action = urlParams.get('action');
    const requestId = urlParams.get('request_id');

    if (!action || !requestId) {
      showError('❌ 無效的審核連結');
    } else if (action === 'approve') {
      processBorrow('approve');
    } else if (action === 'reject') {
      processBorrow('reject');
    } else {
      showError('❌ 無效的審核動作');
    }

    // 處理借用審核
    async function processBorrow(actionType) {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '<p class="loading">正在處理，請稍候...</p>';

      try {
        const url = new URL(GAS_URL);
        url.searchParams.append('action', actionType === 'approve' ? 'approveBorrow' : 'rejectBorrow');
        url.searchParams.append('request_id', requestId);

        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });

        const data = await res.json();

        if (data.success || data.status === 'success' || (!data.error && data.message)) {
          const resultText = actionType === 'approve' ? '✅ 已核准借用' : '❌ 已拒絕借用';
          const resultColor = actionType === 'approve' ? 'success' : 'error';
          
          contentDiv.innerHTML = `
            <p class="${resultColor}" style="font-size: 1.2em; margin: 20px 0;">
              ${resultText}
            </p>
            <p style="color: #666;">
              系統已自動通知借用人審核結果。
            </p>
            <p style="color: #999; font-size: 0.9em; margin-top: 15px;">
              3 秒後自動返回首頁...
            </p>
          `;
          
          setTimeout(() => {
            window.location.href = './index.html';
          }, 3000);
        } else {
          throw new Error(data.error || '處理失敗');
        }
      } catch (err) {
        contentDiv.innerHTML = `
          <p class="error" style="font-size: 1.2em; margin: 20px 0;">
            ❌ 處理失敗
          </p>
          <p style="color: #666;">
            ${err.message}
          </p>
          <button onclick="window.location.href='./index.html'" style="margin-top: 20px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
            返回首頁
          </button>
        `;
      }
    }

    // 顯示錯誤
    function showError(message) {
      document.getElementById('title').textContent = '❌ 錯誤';
      document.getElementById('content').innerHTML = `
        <p class="error" style="font-size: 1.2em; margin: 20px 0;">
          ${message}
        </p>
        <button onclick="window.location.href='./index.html'" style="margin-top: 20px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
          返回首頁
        </button>
      `;
    }
  </script>
</body>
</html>
