<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核借用申請 - MT 設備系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .container {
      background: white;
      padding: 28px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #667eea; margin-bottom: 12px; }
    .info { background: #f8f9fa; padding: 14px 18px; border-radius: 8px; margin: 14px 0; text-align: left; }
    .info p { margin: 6px 0; color: #333; }
    .info strong { color: #667eea; }
    .btn-approve { background: #28a745; color: white; border: none; padding: 11px 26px; border-radius: 8px; font-size: 1.05em; cursor: pointer; margin: 8px 5px; }
    .btn-approve:hover { background: #218838; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 11px 26px; border-radius: 8px; font-size: 1.05em; cursor: pointer; margin: 8px 5px; }
    .btn-reject:hover { background: #c82333; }
    .loading { color: #667eea; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .hidden { display: none; }
    .debug { background: #fff3cd; padding: 10px; margin: 10px 0; border-radius: 4px; font-family: monospace; font-size: 12px; text-align: left; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔒 審核借用申請</h1>
    <div id="debug-area" class="debug hidden"></div>
    <div id="content">
      <div class="info">
        <p><strong>📦 設備編號：</strong><span id="device-no">載入中...</span></p>
        <p><strong>📝 設備名稱：</strong><span id="device-name">載入中...</span></p>
        <p><strong>👤 申請人：</strong><span id="borrower-name">載入中...</span></p>
        <p><strong>📧 申請人 Email：</strong><span id="borrower-email">載入中...</span></p>
        <p><strong>📅 借用日期：</strong><span id="borrow-date">載入中...</span></p>
        <p><strong>⏰ 預計歸還：</strong><span id="due-date">載入中...</span></p>
      </div>
      <p id="prompt" style="color: #666; margin: 12px 0;">請確認上述資訊後，選擇是否同意借用：</p>
      <div id="buttons">
        <button class="btn-approve" onclick="processBorrow('approve')">✅ 同意借用</button>
        <button class="btn-reject" onclick="processBorrow('reject')">❌ 不同意借用</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';
    
    function debug(msg) {
      console.log(msg);
      // 除錯訊息只顯示在 console，不在頁面上顯示
      // const debugArea = document.getElementById('debug-area');
      // debugArea.classList.remove('hidden');
      // debugArea.innerHTML += msg + '<br>';
    }
    
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('request_id');
    
    debug('requestId from URL: ' + requestId);
    
    if (!requestId) {
      document.getElementById('title').textContent = '❌ 錯誤';
      document.getElementById('content').innerHTML = '<p class="error">❌ 無效的審核連結</p>';
    } else {
      loadRequestInfo();
    }
    
    async function loadRequestInfo() {
      try {
        const url = GAS_URL + '?action=getBorrowRequest&request_id=' + encodeURIComponent(requestId);
        debug('載入 URL: ' + url);
        const res = await fetch(url);
        debug('載入回應狀態: ' + res.status);
        const data = await res.json();
        debug('載入資料: ' + JSON.stringify(data));
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        document.getElementById('device-no').textContent = data.fix_no || 'N/A';
        document.getElementById('device-name').textContent = data.device_name || 'N/A';
        document.getElementById('borrower-name').textContent = data.borrower || 'N/A';
        document.getElementById('borrower-email').textContent = data.borrower_email || 'N/A';
        
        // 格式化日期時間顯示
        const formatDateTime = (dt) => {
          if (!dt) return '未設定';
          if (dt.includes('T')) {
            const [date, time] = dt.split('T');
            return `${date} ${time}`;
          }
          return dt;
        };
        
        document.getElementById('borrow-date').textContent = formatDateTime(data.dt_borrow) || 'N/A';
        document.getElementById('due-date').textContent = formatDateTime(data.dt_due) || '未設定';
      } catch (err) {
        debug('載入錯誤: ' + err.message);
        const errorMsg = err.message || '';
        if (errorMsg.includes('已失效') || errorMsg.includes('找不到')) {
          document.getElementById('title').textContent = '❌ 連結無效';
          document.getElementById('content').innerHTML = `
            <div style="text-align:center;padding:30px;">
              <p style="font-size:3em;margin-bottom:20px;">🔗</p>
              <p style="color:#dc3545;font-size:1.2em;">此審核連結已失效</p>
              <p style="color:#666;margin-top:10px;">可能原因：</p>
              <ul style="color:#888;text-align:left;display:inline-block;margin-top:10px;">
                <li> Keeper 已經審核過了</li>
                <li> 此連結已過期</li>
              </ul>
              <p style="margin-top:30px;"><a href="index.html" style="color:#667eea;">→ 返回設備系統</a></p>
            </div>
          `;
        } else {
          document.getElementById('title').textContent = '❌ 錯誤';
          document.getElementById('content').innerHTML = '<p class="error">載入失敗：' + err.message + '</p>';
        }
      }
    }
    
    async function processBorrow(action) {
      debug('processBorrow called, action: ' + action);
      
      const btnApprove = document.querySelector('.btn-approve');
      const btnReject = document.querySelector('.btn-reject');
      const prompt = document.getElementById('prompt');
      
      btnApprove.disabled = true;
      btnReject.disabled = true;
      btnApprove.textContent = '處理中...';
      btnReject.textContent = '處理中...';
      prompt.textContent = '請稍候...';
      
      try {
        const url = GAS_URL + '?action=' + (action === 'approve' ? 'approveBorrow' : 'rejectBorrow') + '&request_id=' + encodeURIComponent(requestId);
        debug('核准 URL: ' + url);
        
        const res = await fetch(url);
        debug('核准回應狀態: ' + res.status);
        
        const text = await res.text();
        debug('核准回應文字: ' + text.substring(0, 200));
        
        let data;
        try {
          data = JSON.parse(text);
        } catch (e) {
          throw new Error('回應不是有效的 JSON: ' + text.substring(0, 100));
        }
        
        debug('核准資料: ' + JSON.stringify(data));
        
        if (data.success) {
          document.getElementById('title').textContent = action === 'approve' ? '✅ 已核准借用' : '❌ 已拒絕借用';
          
          const msg = action === 'approve' ? '✅ 借用已核准' : '❌ 借用已拒絕';
          document.getElementById('content').innerHTML = '<p class="success" style="font-size:1.2em;padding:20px;">' + msg + '</p>';
          
          // 3秒後跳轉
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 3000);
        } else {
          throw new Error(data.error || data.message || '處理失敗');
        }
      } catch (err) {
        debug('核准錯誤: ' + err.message);
        alert('處理失敗：' + err.message);
        btnApprove.disabled = false;
        btnReject.disabled = false;
        btnApprove.textContent = '✅ 同意借用';
        btnReject.textContent = '❌ 不同意借用';
        prompt.textContent = '請確認後選擇：';
      }
    }
  </script>
</body>
</html>
