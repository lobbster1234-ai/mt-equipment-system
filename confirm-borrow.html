<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核借用申請 - MT 設備系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 20px;
    }
    
    .info {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      margin: 20px 0;
      text-align: left;
    }
    
    .info p {
      margin: 10px 0;
      color: #333;
    }
    
    .info strong {
      color: #667eea;
    }
    
    .btn-approve {
      background: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      margin: 10px 5px;
      transition: background 0.3s;
    }
    
    .btn-approve:hover {
      background: #218838;
    }
    
    .btn-reject {
      background: #dc3545;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 1.1em;
      cursor: pointer;
      margin: 10px 5px;
      transition: background 0.3s;
    }
    
    .btn-reject:hover {
      background: #c82333;
    }
    
    .success {
      color: #28a745;
    }
    
    .error {
      color: #dc3545;
    }
    
    .loading {
      color: #667eea;
    }
    
    .buttons {
      margin-top: 30px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔒 審核借用申請</h1>
    <div id="content">
      <div class="info">
        <p><strong>📦 設備編號：</strong><span id="device-no">載入中...</span></p>
        <p><strong>📝 設備名稱：</strong><span id="device-name">載入中...</span></p>
        <p><strong>👤 申請人：</strong><span id="borrower-name">載入中...</span></p>
        <p><strong>📧 申請人 Email：</strong><span id="borrower-email">載入中...</span></p>
        <p><strong>📅 借用日期：</strong><span id="borrow-date">載入中...</span></p>
        <p><strong>⏰ 預計歸還：</strong><span id="due-date">載入中...</span></p>
      </div>
      <p style="color: #666; margin: 20px 0;">
        請確認上述資訊後，選擇是否同意借用：
      </p>
      <div class="buttons">
        <button class="btn-approve" onclick="processBorrow('approve')">✅ 同意借用</button>
        <button class="btn-reject" onclick="processBorrow('reject')">❌ 不同意借用</button>
      </div>
    </div>
  </div>

  <script>
    // GAS 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';

    // 從 URL 參數獲取 request_id
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('request_id');

    if (!requestId) {
      showError('❌ 無效的審核連結');
    } else {
      // 載入借用請求資訊
      loadRequestInfo();
    }

    // 載入借用請求資訊
    async function loadRequestInfo() {
      try {
        const url = new URL(GAS_URL);
        url.searchParams.append('action', 'getBorrowRequest');
        url.searchParams.append('request_id', requestId);

        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });

        const data = await res.json();

        if (data.error) {
          throw new Error(data.error);
        }

        // 顯示借用資訊
        document.getElementById('device-no').textContent = data.fix_no || 'N/A';
        document.getElementById('device-name').textContent = data.device_name || 'N/A';
        document.getElementById('borrower-name').textContent = data.borrower || 'N/A';
        document.getElementById('borrower-email').textContent = data.borrower_email || 'N/A';
        document.getElementById('borrow-date').textContent = data.dt_borrow || 'N/A';
        document.getElementById('due-date').textContent = data.dt_due || '未設定';
      } catch (err) {
        showError('❌ 載入失敗：' + err.message);
      }
    }

    // 處理借用審核
    async function processBorrow(actionType) {
      const contentDiv = document.getElementById('content');
      
      // 隱藏按鈕，顯示處理中
      contentDiv.innerHTML = '<p class="loading" style="font-size: 1.2em;">🔄 正在處理，請稍候...</p>';

      try {
        const url = new URL(GAS_URL);
        url.searchParams.append('action', actionType === 'approve' ? 'approveBorrow' : 'rejectBorrow');
        url.searchParams.append('request_id', requestId);

        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });

        const data = await res.json();

        if (data.success || data.status === 'success' || (!data.error && data.message)) {
          const resultText = actionType === 'approve' ? '✅ 已核准借用' : '❌ 已拒絕借用';
          const resultColor = actionType === 'approve' ? 'success' : 'error';
          
          contentDiv.innerHTML = `
            <p class="${resultColor}" style="font-size: 1.5em; margin: 30px 0;">
              ${resultText}
            </p>
            <p style="color: #666; margin: 20px 0;">
              系統已自動通知借用人審核結果。
            </p>
            <p style="color: #999; font-size: 0.9em; margin-top: 30px;">
              3 秒後自動返回首頁...
            </p>
          `;
          
          setTimeout(() => {
            window.location.href = './index.html';
          }, 3000);
        } else {
          throw new Error(data.error || '處理失敗');
        }
      } catch (err) {
        contentDiv.innerHTML = `
          <p class="error" style="font-size: 1.2em; margin: 20px 0;">
            ❌ 處理失敗
          </p>
          <p style="color: #666;">
            ${err.message}
          </p>
          <button onclick="window.location.href='./index.html'" style="margin-top: 20px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
            返回首頁
          </button>
        `;
      }
    }

    // 顯示錯誤
    function showError(message) {
      document.getElementById('title').textContent = '❌ 錯誤';
      document.getElementById('content').innerHTML = `
        <p class="error" style="font-size: 1.2em; margin: 20px 0;">
          ${message}
        </p>
        <button onclick="window.location.href='./index.html'" style="margin-top: 20px; padding: 10px 20px; background: #667eea; color: white; border: none; border-radius: 8px; cursor: pointer;">
          返回首頁
        </button>
      `;
    }
  </script>
</body>
</html>
