<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核借用申請 - MT 設備系統</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      margin: 0;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #667eea; margin-bottom: 20px; }
    .info { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left; }
    .info p { margin: 10px 0; color: #333; }
    .info strong { color: #667eea; }
    .btn-approve { background: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin: 10px 5px; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin: 10px 5px; }
    .loading { color: #667eea; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    #debug { margin-top: 20px; padding: 10px; background: #f0f0f0; font-size: 12px; text-align: left; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔒 審核借用申請</h1>
    <div id="content">
      <div class="info" id="info-section">
        <p><strong>📦 設備編號：</strong><span id="device-no">載入中...</span></p>
        <p><strong>📝 設備名稱：</strong><span id="device-name">載入中...</span></p>
        <p><strong>👤 申請人：</strong><span id="borrower-name">載入中...</span></p>
        <p><strong>📧 申請人 Email：</strong><span id="borrower-email">載入中...</span></p>
        <p><strong>📅 借用日期：</strong><span id="borrow-date">載入中...</span></p>
        <p><strong>⏰ 預計歸還：</strong><span id="due-date">載入中...</span></p>
      </div>
      <div id="buttons" style="display:none;">
        <p style="color: #666; margin: 20px 0;">請確認上述資訊後，選擇是否同意借用：</p>
        <button class="btn-approve" id="btn-approve" onclick="processBorrow('approve')">✅ 同意借用</button>
        <button class="btn-reject" id="btn-reject" onclick="processBorrow('reject')">❌ 不同意借用</button>
      </div>
      <div id="debug"></div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';
    
    const debug = document.getElementById('debug');
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('request_id');
    
    debug.textContent = 'request_id: ' + (requestId || 'null');
    
    if (!requestId) {
      document.getElementById('title').textContent = '❌ 錯誤';
      debug.textContent += '\n錯誤：沒有 request_id';
    } else {
      loadRequestInfo();
    }
    
    async function loadRequestInfo() {
      try {
        const url = GAS_URL + '?action=getBorrowRequest&request_id=' + encodeURIComponent(requestId);
        debug.textContent += '\n請求 URL: ' + url;
        
        const res = await fetch(url);
        debug.textContent += '\nStatus: ' + res.status;
        
        const data = await res.json();
        debug.textContent += '\n回應: ' + JSON.stringify(data);
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        document.getElementById('device-no').textContent = data.fix_no || 'N/A';
        document.getElementById('device-name').textContent = data.device_name || 'N/A';
        document.getElementById('borrower-name').textContent = data.borrower || 'N/A';
        document.getElementById('borrower-email').textContent = data.borrower_email || 'N/A';
        document.getElementById('borrow-date').textContent = data.dt_borrow || 'N/A';
        document.getElementById('due-date').textContent = data.dt_due || '未設定';
        
        document.getElementById('buttons').style.display = 'block';
        debug.textContent += '\n載入成功！';
      } catch (err) {
        debug.textContent += '\n錯誤: ' + err.message;
        document.getElementById('title').textContent = '❌ 錯誤';
        document.getElementById('info-section').innerHTML = '<p class="error">載入失敗：' + err.message + '</p>';
      }
    }
    
    async function processBorrow(action) {
      const btn = document.getElementById(action === 'approve' ? 'btn-approve' : 'btn-reject');
      btn.disabled = true;
      btn.textContent = '處理中...';
      
      try {
        const url = GAS_URL + '?action=' + (action === 'approve' ? 'approveBorrow' : 'rejectBorrow') + '&request_id=' + encodeURIComponent(requestId);
        debug.textContent += '\n\n' + action + ' URL: ' + url;
        
        const res = await fetch(url);
        const data = await res.json();
        debug.textContent += '\n' + action + ' 回應: ' + JSON.stringify(data);
        
        if (data.success) {
          document.getElementById('title').textContent = action === 'approve' ? '✅ 已核准借用' : '❌ 已拒絕借用';
          document.getElementById('buttons').style.display = 'none';
          document.getElementById('info-section').innerHTML = '<p class="success" style="font-size:1.2em;">' + (action === 'approve' ? '已核准借用' : '已拒絕借用') + '</p><p style="color:#666;">系統已自動通知借用人審核結果。</p>';
        } else {
          throw new Error(data.error || data.message || '處理失敗');
        }
      } catch (err) {
        debug.textContent += '\n錯誤: ' + err.message;
        alert('處理失敗：' + err.message);
        btn.disabled = false;
        btn.textContent = action === 'approve' ? '✅ 同意借用' : '❌ 不同意借用';
      }
    }
  </script>
</body>
</html>
