<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>確認歸還 - MT 設備系統</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .container {
      background: white;
      padding: 28px 32px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    
    h1 {
      color: #667eea;
      margin-bottom: 12px;
    }

    .info {
      background: #f8f9fa;
      padding: 14px 18px;
      border-radius: 8px;
      margin: 14px 0;
      text-align: left;
    }

    .info p {
      margin: 6px 0;
      color: #333;
    }
    
    .info strong {
      color: #667eea;
    }
    
    .btn {
      background: #667eea;
      color: white;
      border: none;
      padding: 11px 26px;
      border-radius: 8px;
      font-size: 1.05em;
      cursor: pointer;
      margin: 8px 5px;
      transition: background 0.3s;
    }
    
    .btn:hover {
      background: #5568d3;
    }
    
    .btn-secondary {
      background: #6c757d;
    }
    
    .btn-secondary:hover {
      background: #5a6268;
    }
    
    .success {
      color: #28a745;
    }
    
    .error {
      color: #dc3545;
    }
    
    .loading {
      color: #667eea;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔒 身份驗證中...</h1>
    <div id="content" class="loading">
      正在驗證您的身份，請稍候...
    </div>
  </div>

  <script>
    // GAS 網址
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';

    // 從 URL 參數獲取 token
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      showError('❌ 無效的確認連結');
    } else {
      // 先驗證 Token 是否有效（一次性）
      validateToken(token).then(isValid => {
        if (!isValid) {
          showError('❌ 連結無效或已過期');
        } else {
          // Token 有效，解碼並載入設備資訊
          try {
            const decoded = atob(token);
            const [fixNo, keeperEmail, timestamp] = decoded.split(':');
            
            if (!fixNo || !keeperEmail || !timestamp) {
              showError('❌ 無效的確認連結');
            } else {
              loadEquipmentInfo(fixNo, keeperEmail);
            }
          } catch (err) {
            showError('❌ 無效的確認連結');
          }
        }
      });
    }

    // 驗證 Token 是否有效（一次性）
    async function validateToken(token) {
      try {
        const url = new URL(GAS_URL);
        url.searchParams.append('action', 'validateReturnToken');
        url.searchParams.append('token', token);

        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });

        const data = await res.json();
        return data.valid === true;
      } catch (err) {
        return false;
      }
    }

    // 載入設備資訊
    async function loadEquipmentInfo(fixNo, keeperEmail) {
      try {
        const url = new URL(GAS_URL);
        url.searchParams.append('action', 'getEquipmentInfo');
        url.searchParams.append('fix_no', fixNo);

        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });

        const data = await res.json();

        if (data.error) {
          showError(`❌ ${data.error}`);
        } else {
          showConfirmForm(data, keeperEmail);
        }
      } catch (err) {
        showError(`❌ 載入失敗：${err.message}`);
      }
    }

    // 顯示確認表單
    function showConfirmForm(equipment, keeperEmail) {
      document.getElementById('title').textContent = '📥 確認收到';
      document.getElementById('content').innerHTML = `
        <div class="info">
          <p><strong>設備編號：</strong>${equipment.fix_no}</p>
          <p><strong>設備名稱：</strong>${equipment.device_name}</p>
          <p><strong>保管人：</strong>${equipment.keeper}</p>
          <p><strong>借用人：</strong>${equipment.borrower || '未知'}</p>
          <p><strong>歸還日期：</strong>${formatDateTime(equipment.dt_return) || '未知'}</p>
        </div>
        <p style="margin: 20px 0; color: #666;">
          請確認您已收到上述設備，點擊下方按鈕完成歸還確認。
        </p>
        <button class="btn" onclick="confirmReturn('${equipment.fix_no}', '${keeperEmail}')">
          ✅ 確認收到
        </button>
        <button class="btn btn-secondary" onclick="window.location.href='./index.html'">
          未收到
        </button>
      `;
    }

    // 確認歸還
    async function confirmReturn(fixNo, keeperEmail) {
      const contentDiv = document.getElementById('content');
      contentDiv.innerHTML = '<p class="loading">正在處理，請稍候...</p>';

      try {
        const url = new URL(GAS_URL);
        url.searchParams.append('action', 'confirmReturn');
        url.searchParams.append('fix_no', fixNo);
        url.searchParams.append('keeper_email', keeperEmail);
        url.searchParams.append('token', token); // 傳送一次性 token

        const res = await fetch(url.toString(), {
          method: 'GET',
          redirect: 'follow'
        });

        const data = await res.json();

        // 檢查是否是連結無效或已過期的錯誤
        if (data.error && (data.error.includes('無效') || data.error.includes('過期') || data.error.includes('失效'))) {
          contentDiv.innerHTML = `
            <p class="error" style="font-size: 1.2em; margin: 20px 0;">
              ❌ ${data.error}
            </p>
            <p style="color: #666;">
              此連結已失效，可能是已使用過或已過期。<br>
              如需確認歸還，請聯繫借用人或系統管理員。
            </p>
            <button class="btn btn-secondary" onclick="window.location.href='./index.html'">
              返回首頁
            </button>
          `;
        } else if (data.success || data.status === 'success' || (!data.error && data.message)) {
          contentDiv.innerHTML = `
            <p class="success" style="font-size: 1.2em; margin: 20px 0;">
              ✅ 歸還已確認！
            </p>
            <p style="color: #666;">
              設備狀態已更新為「可借用」<br>
              感謝您的配合！
            </p>
            <p style="color: #999; font-size: 0.9em; margin-top: 15px;">
              3 秒後自動返回首頁...
            </p>
          `;
          
          // 3 秒後自動跳轉回首頁
          setTimeout(() => {
            window.location.href = './index.html';
          }, 3000);
        } else {
          throw new Error(data.error || '確認失敗');
        }
      } catch (err) {
        contentDiv.innerHTML = `
          <p class="error" style="font-size: 1.2em; margin: 20px 0;">
            ❌ 確認失敗
          </p>
          <p style="color: #666;">
            ${err.message}
          </p>
          <button class="btn" onclick="window.location.href='./index.html'" style="margin-top: 20px;">
            返回首頁
          </button>
        `;
      }
    }

    // 顯示錯誤
    function showError(message) {
      document.getElementById('title').textContent = '❌ 錯誤';
      document.getElementById('content').innerHTML = `
        <p class="error" style="font-size: 1.2em; margin: 20px 0;">
          ${message}
        </p>
        <button class="btn" onclick="window.location.href='./index.html'" style="margin-top: 20px;">
          返回首頁
        </button>
      `;
    }

    /**
     * 格式化日期時間為 yyyy-MM-dd HH:mm（總是顯示時間）
     */
    function formatDateTime(value) {
      if (!value) return '未知';
      
      // 如果已經是 yyyy-MM-dd HH:mm:ss 格式
      if (typeof value === 'string' && /^\d{4}-\d{2}-\d{2}( \d{2}:\d{2}:\d{2})?$/.test(value.trim())) {
        // 只取日期和時分
        const parts = value.trim().split(' ');
        if (parts.length === 2) {
          return parts[0] + ' ' + parts[1].substring(0, 5); // yyyy-MM-dd HH:mm
        }
        return parts[0] + ' 00:00'; // 如果只有日期，補上時間
      }
      
      // 處理 datetime-local 格式 (yyyy-MM-ddTHH:mm)
      if (typeof value === 'string' && value.includes('T')) {
        const [date, time] = value.split('T');
        return date + ' ' + time.substring(0, 5);
      }
      
      // 嘗試解析為 Date
      const date = new Date(value);
      if (isNaN(date.getTime())) {
        return String(value).trim();
      }
      
      // 格式化為 yyyy-MM-dd HH:mm（台北時間 GMT+8）
      const taipeiOffset = 8 * 60;
      const localOffset = date.getTimezoneOffset();
      const offsetDiff = taipeiOffset + localOffset;
      const taipeiDate = new Date(date.getTime() + offsetDiff * 60000);
      
      const year = taipeiDate.getFullYear();
      const month = String(taipeiDate.getMonth() + 1).padStart(2, '0');
      const day = String(taipeiDate.getDate()).padStart(2, '0');
      const hours = String(taipeiDate.getHours()).padStart(2, '0');
      const minutes = String(taipeiDate.getMinutes()).padStart(2, '0');
      
      return `${year}-${month}-${day} ${hours}:${minutes}`;
    }
  </script>
</body>
</html>
