<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>審核設備轉讓 - MT 設備系統</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
      max-width: 500px;
      width: 100%;
      text-align: center;
    }
    h1 { color: #667eea; margin-bottom: 20px; }
    .info { background: #f8f9fa; padding: 20px; border-radius: 8px; margin: 20px 0; text-align: left; }
    .info p { margin: 10px 0; color: #333; }
    .info strong { color: #667eea; }
    .highlight { background: #fff3cd; padding: 5px 10px; border-radius: 4px; display: inline-block; }
    .equipment-list { background: #e9ecef; padding: 15px; border-radius: 8px; margin: 15px 0; text-align: left; max-height: 200px; overflow-y: auto; }
    .equipment-item { padding: 5px 0; border-bottom: 1px solid #ccc; }
    .equipment-item:last-child { border-bottom: none; }
    .btn-approve { background: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin: 10px 5px; }
    .btn-approve:hover { background: #218838; }
    .btn-reject { background: #dc3545; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 1.1em; cursor: pointer; margin: 10px 5px; }
    .btn-reject:hover { background: #c82333; }
    .loading { color: #667eea; }
    .error { color: #dc3545; }
    .success { color: #28a745; }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <h1 id="title">🔄 審核設備轉讓</h1>
    <div id="content">
      <div class="info">
        <p><strong>📤 轉出 Keeper：</strong><span id="from-keeper">載入中...</span></p>
        <p><strong>📥 接收 Keeper：</strong><span id="to-keeper">載入中...</span></p>
        <p><strong>📅 申請時間：</strong><span id="request-time">載入中...</span></p>
      </div>
      <div id="equipment-section" class="equipment-list" style="display:none;">
        <strong>即將轉讓的設備：</strong>
        <div id="equipment-list"></div>
      </div>
      <p id="prompt" style="color: #666; margin: 20px 0;">請確認上述資訊後，選擇是否同意接受轉讓：</p>
      <div id="buttons">
        <button class="btn-approve" onclick="processTransfer('approve')">✅ 同意接受</button>
        <button class="btn-reject" onclick="processTransfer('reject')">❌ 不同意</button>
      </div>
    </div>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbxeI5xC33a6Ry634g6kwBPK9feElH_tTPtQYeWcH4ReiEiiq5I9yIetv8ugAFDgJkHh1A/exec';
    
    const urlParams = new URLSearchParams(window.location.search);
    const requestId = urlParams.get('request_id');
    
    if (!requestId) {
      document.getElementById('title').textContent = '❌ 錯誤';
      document.getElementById('content').innerHTML = '<p class="error">❌ 無效的審核連結</p>';
    } else {
      loadRequestInfo();
    }
    
    async function loadRequestInfo() {
      try {
        const url = GAS_URL + '?action=getTransferRequest&request_id=' + encodeURIComponent(requestId);
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.error) {
          throw new Error(data.error);
        }
        
        document.getElementById('from-keeper').textContent = data.from_keeper || 'N/A';
        document.getElementById('to-keeper').textContent = data.to_keeper || 'N/A';
        document.getElementById('request-time').textContent = formatDateTime(data.dt_request) || 'N/A';
        
        if (data.equipment && data.equipment.length > 0) {
          const equipSection = document.getElementById('equipment-section');
          if (equipSection) {
            equipSection.style.display = 'block';
            document.getElementById('equipment-list').innerHTML = data.equipment.map(eq => 
              '<div class="equipment-item">📦 ' + eq.fix_no + ' - ' + eq.device_name + '</div>'
            ).join('');
          }
        }
      } catch (err) {
        // 根據錯誤訊息判斷是「連結無效」還是「載入失敗」
        const errorMsg = err.message || '';
        if (errorMsg.includes('已失效') || errorMsg.includes('找不到')) {
          document.getElementById('title').textContent = '❌ 連結無效';
          document.getElementById('content').innerHTML = `
            <div style="text-align:center;padding:30px;">
              <p style="font-size:3em;margin-bottom:20px;">🔗</p>
              <p style="color:#dc3545;font-size:1.2em;">此審核連結已失效</p>
              <p style="color:#666;margin-top:10px;">可能原因：</p>
              <ul style="color:#888;text-align:left;display:inline-block;margin-top:10px;">
                <li> 已經審核過了</li>
                <li> 此連結已過期</li>
              </ul>
              <p style="margin-top:30px;"><a href="index.html" style="color:#667eea;">→ 返回設備系統</a></p>
            </div>
          `;
        } else {
          document.getElementById('title').textContent = '❌ 錯誤';
          const contentDiv = document.getElementById('content');
          if (contentDiv) {
            contentDiv.innerHTML = '<p style="color:#dc3545;padding:20px;">載入失敗：' + err.message + '</p>';
          }
        }
      }
    }
    
    function formatDateTime(value) {
      if (!value) return '';
      if (value.includes('T')) {
        const [date, time] = value.split('T');
        return date + ' ' + time.substring(0, 5);
      }
      return value;
    }
    
    async function processTransfer(action) {
      const btnApprove = document.querySelector('.btn-approve');
      const btnReject = document.querySelector('.btn-reject');
      const prompt = document.getElementById('prompt');
      
      btnApprove.disabled = true;
      btnReject.disabled = true;
      btnApprove.textContent = '處理中...';
      btnReject.textContent = '處理中...';
      prompt.textContent = '請稍候...';
      
      try {
        const url = GAS_URL + '?action=' + (action === 'approve' ? 'approveTransfer' : 'rejectTransfer') + '&request_id=' + encodeURIComponent(requestId);
        const res = await fetch(url);
        const data = await res.json();
        
        if (data.success) {
          document.getElementById('title').textContent = action === 'approve' ? '✅ 已同意轉讓' : '❌ 已拒絕轉讓';
          const msg = action === 'approve' 
            ? '✅ 設備轉讓已核准！<br><br>設備已移轉至您的名下。'
            : '❌ 設備轉讓已拒絕。<br><br>設備維持在原 Keeper 名下。';
          document.getElementById('content').innerHTML = '<p style="font-size:1.2em;padding:20px;">' + msg + '</p>';
          const buttonsEl = document.getElementById('buttons');
          const promptEl = document.getElementById('prompt');
          if (buttonsEl) buttonsEl.style.display = 'none';
          if (promptEl) promptEl.style.display = 'none';
          
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 3000);
        } else {
          throw new Error(data.error || '處理失敗');
        }
      } catch (err) {
        alert('處理失敗：' + err.message);
        btnApprove.disabled = false;
        btnReject.disabled = false;
        btnApprove.textContent = '✅ 同意接受';
        btnReject.textContent = '❌ 不同意';
        prompt.textContent = '請確認後選擇：';
      }
    }
  </script>
</body>
</html>
